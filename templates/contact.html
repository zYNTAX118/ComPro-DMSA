{% extends "base.html" %}
{% block content %}

<style>
/* ==== Base typography ==== */
body {
  font-family: "Segoe UI", Roboto, sans-serif;
  line-height: 1.45;
}

/* ==== Section container ==== */
.container {
  max-width: 640px;                 /* nice readable width              */
  margin: 120px auto 60px;          /* push below navbar (≈100 px)       */
  padding: 32px 40px;
  background: rgba(255, 255, 255, 0.94);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
}

/* ==== Headings ==== */
.container h2 {
  margin-top: 140px;
  font-size: 32px;
  text-align: center;

}

/* ==== Flash message ==== */
.flash-messages {
  margin-bottom: 20px;
  padding: 12px 16px;
  border-radius: 6px;
  background: #ffeaea;
  color: #b42424;
  font-weight: 600;
  text-align: center;
}

/* ==== Form layout ==== */
.contact-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top:140px;
}

.contact-form .form-group {
  display: flex;
  flex-direction: column;
}

.contact-form label {
  margin-bottom: 6px;
  font-weight: 600;
}

.contact-form input[type="text"],
.contact-form input[type="email"],
.contact-form textarea {
  padding: 12px 14px;
  font-size: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  outline: none;
  transition: border-color 0.2s;
}

.contact-form input:focus,
.contact-form textarea:focus {
  border-color: #4caf50;
}

.contact-form textarea {
  min-height: 140px;
  resize: vertical;
}

/* ==== Submit button ==== */
.contact-form .btn {
  align-self: flex-start;           /* keeps button left-aligned        */
  background: #4caf50;
  color: #fff;
  border: none;
  padding: 12px 28px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s;
}

.contact-form .btn:hover {
  background: #45a049;
}

/* ==== reCAPTCHA badge (optional tweak) ==== */
/* You may move it upward a little so it’s not buried by your image footer */
.grecaptcha-badge {
  z-index: 9999;          /* keep on top of the collage */
  bottom: 12px !important;
  right: 12px !important;
}
</style>

<!-- load reCAPTCHA JS *before* your form -->
<script src="https://www.google.com/recaptcha/api.js?render={{ site_key }}"></script>
<script>
  // Obtain a token every time the page loads
  grecaptcha.ready(function () {
    grecaptcha.execute('{{ site_key }}', { action: 'contact' }).then(function (token) {
      document.getElementById('g-recaptcha-response').value = token;
    });
  });
</script>

<style>
/* … your existing CSS exactly as before … */
</style>

<div class="container" style="margin-top:100px;">
  <h2>Contact Us</h2>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-messages">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('contact') }}" enctype="multipart/form-data" class="contact-form">
    <!-- hidden token field (MUST stay inside the form) -->
    <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response">

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email" required>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Your message" rows="5" required></textarea>
    </div>
    <div class="form-group">
      <label for="attachment">Attachment (optional)</label>
      <input type="file" id="attachment" name="attachment" accept=".pdf,.doc,.docx,.jpg,.png,.txt">
    </div>
    <button type="submit" class="btn">Send Message</button>
  </form>
</div>
{% endblock %}
