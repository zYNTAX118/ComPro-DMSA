<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo.png') }}" />
    <title>PT. Dwi Mandiri Sejahtera Agung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="overlay">

      <!-- Header / Navigation -->
      <header>
        <nav class="navbar navbar-expand-lg navbar-light custom-blur-navbar" style="flex-wrap:wrap;">
          <div class="container-fluid flex-wrap">

            <!-- Logo and Brand Name -->
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
              <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DMSA Logo"
                width="40" height="40" class="d-inline-block align-text-center me-2 rounded-circle">
              PT. Dwi Mandiri Sejahtera Agung
            </a>

            <!-- Toggler for small screens -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Row 1 right side: Nav links -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('about') }}">About</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('products') }}">Products</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('contact') }}">Request an inquiry</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('principals') }}">Partnerships</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('privacy') }}">Privacy Policy</a>
                </li>
              </ul>
            </div>

            <!-- Row 2: Injected by child pages only (e.g. search bar on products page) -->
            {% block navbar_extra %}{% endblock %}

          </div>
        </nav>
      </header>

      <!-- Page-specific content -->
      <main>
        {% block content %}
        {% endblock %}
      </main>

      <!-- Footer -->
      <footer>
        <div class="footer-content">
          <p class="footer-text">© 2025 PT. Dwi Mandiri Sejahtera Agung. All rights reserved.
            <br>
            Our Partners:
          </p>
          <div class="partners_logos">
            <a href="https://process.honeywell.com/us/en/ccc" target="_blank" rel="noopener noreferrer" class="ccc">
              <img src="{{ url_for('static', filename='images/ccc.png') }}" alt="Partners Logo" class="logo_ccc">
            </a>
            <a href="https://www.imi-critical.com/brands/imi-remosa/" target="_blank" rel="noopener noreferrer" class="imi">
              <img src="{{ url_for('static', filename='images/imi.png') }}" alt="Partners Logo" class="logo_imi">
            </a>
            <a href="https://www.wika.com/en-en/engineered_solutions_temperature.WIKA" target="_blank" rel="noopener noreferrer" class="wika">
              <img src="{{ url_for('static', filename='images/wika.png') }}" alt="Partners Logo" class="logo_wika">
            </a>
            <a href="https://www.caesaroil.nl/history.html" target="_blank" rel="noopener noreferrer" class="thomassen">
              <img src="{{ url_for('static', filename='images/thomassen.png') }}" alt="Partners Logo" class="logo_thomassen">
            </a>
          </div>
          <h5 class="linkedin-heading mt-4">DMSA — LinkedIn:</h5>
          <div class="logo-box linkedin-box">
            <a href="https://www.linkedin.com/company/pt-dwi-mandiri-sejahtera-agung/" target="_blank" rel="noopener">
              <img src="{{ url_for('static', filename='images/LI-In-Bug.png') }}" alt="LinkedIn logo" class="logo-linkedin">
            </a>
          </div>
        </div>
      </footer>

    </div><!-- /.overlay -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var el = document.querySelector('.aboutus-parallax2');
        if (!el) return;
        var speed = 0.5;
        function update() {
          var rect = el.getBoundingClientRect();
          el.style.backgroundPosition = 'center ' + (-rect.top * speed) + 'px';
        }
        var ticking = false;
        window.addEventListener('scroll', function () {
          if (!ticking) {
            window.requestAnimationFrame(function () { update(); ticking = false; });
            ticking = true;
          }
        });
        update();
      });
    </script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
